    name: model
    namespace: mini-council
    labels:
        com.docker.compose.project: mini-council
        com.docker.compose.service: model
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: mini-council
            com.docker.compose.service: model
