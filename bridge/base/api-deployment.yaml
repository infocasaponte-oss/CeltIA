apiVersion: apps/v1
kind: Deployment
metadata:
    name: api
    namespace: mini-council
    labels:
        com.docker.compose.project: mini-council
        com.docker.compose.service: api
spec:
    replicas: 1
    selector:
        matchLabels:
            com.docker.compose.project: mini-council
            com.docker.compose.service: api
    strategy:
        type: Recreate
    template:
        metadata:
            labels:
                com.docker.compose.project: mini-council
                com.docker.compose.service: api
                com.docker.compose.network.default: "true"
        spec:
            restartPolicy: unless-stopped
            containers:
