                      value: "http://model:8000/v1"
                  ports:
                    - name: api-8080
                      containerPort: 8080
                  volumeMounts:
                    - name: data
                      mountPath: /data
            volumes:
                - name: data
                  persistentVolumeClaim:
                    claimName: api-app-data
