name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install CDE test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Install application dependencies
        continue-on-error: true
        run: |
          pip install -r requirements-api.txt
          pip install -r requirements-mcp.txt
      - name: Environment diagnostics
        run: |
          python --version
          python -m pip --version
          python -m pip check
          python -c "import pytest; print('pytest import ok')"
      - name: Compile Python
        run: python -m compileall -q celtia core apps tests
      - name: Run CDE tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_decision_engine.py tests/test_async_decision_engine.py tests/test_decision_metrics.py tests/test_decision_llm_scorer.py tests/test_decision_runtime.py tests/test_decision_evaluation.py tests/test_decision_robustness.py tests/test_decision_calibration.py tests/test_decision_benchmark.py
      - name: Run remaining tests
        env:
          PYTHONPATH: .
        run: pytest -q --ignore=tests/test_decision_engine.py --ignore=tests/test_async_decision_engine.py --ignore=tests/test_decision_metrics.py --ignore=tests/test_decision_llm_scorer.py --ignore=tests/test_decision_runtime.py --ignore=tests/test_decision_evaluation.py --ignore=tests/test_decision_robustness.py --ignore=tests/test_decision_calibration.py --ignore=tests/test_decision_benchmark.py
