name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q celtia core apps tests
      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q
